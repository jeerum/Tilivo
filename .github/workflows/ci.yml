name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tilivo_app
          POSTGRES_PASSWORD: tilivo_app
          POSTGRES_DB: tilivo_accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilivo_app -d tilivo_accounting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: tilivo_accounting_test
      DATABASE_URL: postgres://tilivo_runtime:tilivo_runtime@127.0.0.1:5432/tilivo_accounting_test
      MIGRATION_DATABASE_URL: postgres://tilivo_app:tilivo_app@127.0.0.1:5432/tilivo_accounting_test
      TEST_DATABASE_URL: postgres://tilivo_runtime:tilivo_runtime@127.0.0.1:5432/tilivo_accounting_test
      WORKER_TEST_DATABASE_URL: postgres://tilivo_worker:tilivo_worker@127.0.0.1:5432/tilivo_accounting_test
      TILIVO_RUNTIME_PASSWORD: tilivo_runtime
      TILIVO_WORKER_PASSWORD: tilivo_worker
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      LOG_LEVEL: silent
      EMAIL_DRIVER: dev
      EMAIL_DEV_OUTBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/api run build
      - run: >-
          PGPASSWORD=tilivo_app psql -h 127.0.0.1 -U tilivo_app -d tilivo_accounting_test
          -c "CREATE ROLE tilivo_runtime LOGIN PASSWORD 'tilivo_runtime'"
      - run: >-
          PGPASSWORD=tilivo_app psql -h 127.0.0.1 -U tilivo_app -d tilivo_accounting_test
          -c "CREATE ROLE tilivo_worker LOGIN PASSWORD 'tilivo_worker'"
      - run: PGPASSWORD=tilivo_app psql -h 127.0.0.1 -U tilivo_app -d postgres -c "GRANT CONNECT ON DATABASE tilivo_accounting_test TO tilivo_runtime"
      - run: node apps/api/dist/migrate.js up
      - run: npm --prefix apps/api test
