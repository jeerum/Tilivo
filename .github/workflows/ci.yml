name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

