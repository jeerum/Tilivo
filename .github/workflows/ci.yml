name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  auth-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mrjkp_test
          POSTGRES_PASSWORD: mrjkp_test
          POSTGRES_DB: mrjkp_accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrjkp_test -d mrjkp_accounting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mrjkp_test:mrjkp_test@127.0.0.1:5432/mrjkp_accounting_test
      TEST_DATABASE_URL: postgres://mrjkp_test:mrjkp_test@127.0.0.1:5432/mrjkp_accounting_test
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      LOG_LEVEL: silent
      EMAIL_DRIVER: dev
      EMAIL_DEV_OUTBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/api run build
      - run: node apps/api/dist/migrate.js up
      - run: npm --prefix apps/api test
