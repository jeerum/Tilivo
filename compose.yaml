name: tilivo

services:
  tilivo-db:
    image: postgres:17-alpine
    container_name: tilivo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tilivo_accounting}
      POSTGRES_USER: ${POSTGRES_USER:-tilivo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tilivo-db-data:/var/lib/postgresql/data
    networks:
      - tilivo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tilivo-api:
    build:
      context: ./apps/api
      target: prod
    container_name: tilivo-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tilivo-db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-noop}
      EMAIL_DEV_OUTBOX: ${EMAIL_DEV_OUTBOX:-false}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3100}:3000"
    depends_on:
      tilivo-db:
        condition: service_healthy
    networks:
      - tilivo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tilivo-web:
    build:
      context: ./apps/web
      target: prod
    container_name: tilivo-web
    restart: unless-stopped
    depends_on:
      tilivo-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3101}:80"
    networks:
      - tilivo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tilivo-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tilivo-db:5432/tilivo_accounting_test
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tilivo-db:5432/tilivo_accounting_test
      LOG_LEVEL: silent
      EMAIL_DRIVER: dev
      EMAIL_DEV_OUTBOX: "true"
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: "false"
    command: ["sh", "-c", "node dist/migrate.js up && npm test"]
    depends_on:
      tilivo-db:
        condition: service_healthy
    networks:
      - tilivo

# The physical volume keeps its legacy name so existing production data is
# preserved; new deployments reference it under the logical name tilivo-db-data.
volumes:
  tilivo-db-data:
    name: mrjkp-accounting-db-data
    external: true

networks:
  tilivo:
    name: tilivo
